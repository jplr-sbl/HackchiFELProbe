name: Build Android APK
# Rebuild v1.3 APK artifact
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle and verify original Hakchi binaries
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/ClusterM/hakchi2/stable/data/fes1.bin -o app/src/main/assets/fes1.bin
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/ClusterM/hakchi2/stable/data/uboot.bin -o app/src/main/assets/uboot.bin
          python3 - <<'PY'
          import hashlib, pathlib
          expected = {
            "fes1.bin": (12624, "a64371dc69714e78132af03bac874278b91bb87e"),
            "uboot.bin": (573440, "0c743b303f129853edef7bb5c1c40d64a355ab03")
          }
          for name, (size, expected_sha) in expected.items():
              data = (pathlib.Path("app/src/main/assets") / name).read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + bytes([0]) + data).hexdigest()
              assert len(data) == size and actual == expected_sha, f"{name}: upstream identity mismatch"
              print(f"PASS {name}: {len(data)} bytes; Git blob SHA-1 {actual}")
          PY
      - name: Automated source regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/java/com/example/hakchifelprobe/MainActivity.java").read_text()
          required = {
              "USB device detection": "VID=0x1F3A, PID=0xEFE8",
              "FES1 loader": "runLoaderV45()",
              "U-Boot full readback": "runUbootStageV47()",
              "One-button workflow": "runOneTapV49()",
              "Flash read path": "runFlashReadV50()",
              "Flash export checksum": "writeFlashSectorExportV51(Uri target)",
              "NES ROM import": "importNesRomV52(Uri uri)",
              "NES library persistence": 'new java.io.File(getFilesDir(),"nes-library")',
          }
          for label, marker in required.items():
              assert marker in source, f"Missing: {label}"
              print(f"PASS source presence: {label}")
          assert "sunxi_flash phy_write" not in source, "Unsafe flash-write command detected"
          assert "NOT installed on NES Classic." in source
          print("PASS: no flash-write command enabled")
          print("NOTE: source checks cannot validate hardware behavior")
          PY
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HakchiFELProbe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
